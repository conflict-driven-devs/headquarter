services:
  app:
    build:
      context: .
      dockerfile: apps/Dockerfile
    environment:
      - APP_ENV=production
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_NAME=postgres
      - DB_PORT=5432
      - JWT_SECRET=dev_secret_key
    depends_on:
      - postgres
    networks:
      - internal

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_HOST_AUTH_METHOD=${POSTGRES_HOST_AUTH_METHOD:-trust}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
    # postgres is internal-only; accessed by app on the docker network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/proxy:/etc/nginx/conf.d:ro
      - ./infra/proxy/certbot-www:/var/www/certbot:ro
      - ./infra/proxy/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - internal

  certbot:
    image: certbot/certbot:2.6.0
    restart: "no"
    volumes:
      - ./infra/proxy/letsencrypt:/etc/letsencrypt
      - ./infra/proxy:/etc/nginx/conf.d
      - ./infra/proxy/certbot-www:/var/www/certbot
    environment:
      - CERTBOT_DOMAINS=${CERTBOT_DOMAINS}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL}
    entrypoint: /bin/sh
    command: -c "\
FIRST=$(echo \"$${CERTBOT_DOMAINS}\" | cut -d',' -f1); \ 
if [ -n \"$${CERTBOT_DOMAINS}\" -a -n \"$${CERTBOT_EMAIL}\" ]; then \ 
  if [ ! -d /etc/letsencrypt/live/$${FIRST} ]; then \ 
    certbot certonly --webroot -w /var/www/certbot -d \"$${CERTBOT_DOMAINS}\" --email \"$${CERTBOT_EMAIL}\" --agree-tos --no-eff-email --non-interactive && \ 
    cat > /etc/nginx/conf.d/ssl.conf <<'EOF'\nserver {\n  listen 443 ssl;\n  server_name $${CERTBOT_DOMAINS};\n  ssl_certificate /etc/letsencrypt/live/$${FIRST}/fullchain.pem;\n  ssl_certificate_key /etc/letsencrypt/live/$${FIRST}/privkey.pem;\n  location / {\n    proxy_pass http://app:8080;\n    proxy_set_header Host $host;\n    proxy_set_header X-Real-IP $remote_addr;\n    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n    proxy_set_header X-Forwarded-Proto $scheme;\n  }\n}\nEOF\n    nginx -s reload || true; \ 
  fi; \ 
fi; \ 
exit 0\
"
    networks:
      - internal


volumes:
  postgres_data:

networks:
  internal:
    driver: bridge