services:
  backend:
    build:
      context: .
      dockerfile: apps/cmd/api/Dockerfile
    environment:
      - APP_ENV=production
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_NAME=postgres
      - DB_PORT=5432
      - JWT_SECRET=dev_secret_key
    depends_on:
      - postgres
    networks:
      - internal

  dashboard:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - internal

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_HOST_AUTH_METHOD=${POSTGRES_HOST_AUTH_METHOD:-trust}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
    # postgres is internal-only; accessed by app on the docker network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    env_file:
      - ./infra/env/${DEPLOY_ENV:-dev}.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/proxy/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./infra/proxy/ssl.conf:/etc/nginx/conf.d/ssl.conf:ro
      - ./infra/proxy/certbot-www:/var/www/certbot:ro
      - ./infra/proxy/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - dashboard
    networks:
      - internal

  certbot:
    image: certbot/certbot:latest
    restart: "no"
    profiles:
      - certbot
    env_file:
      - ./infra/env/${DEPLOY_ENV:-dev}.env
    volumes:
      - ./infra/proxy/certbot.sh:/usr/local/bin/certbot.sh:ro
      - ./infra/proxy/letsencrypt:/etc/letsencrypt
      - ./infra/proxy/ssl.conf:/etc/nginx/conf.d/ssl.conf
      - ./infra/proxy/certbot-www:/var/www/certbot
    command: ["/bin/sh", "/usr/local/bin/certbot.sh"]
    networks:
      - internal


volumes:
  postgres_data:

networks:
  internal:
    driver: bridge