services:
  app:
    build:
      context: ./apps
      dockerfile: cmd/jiramo/Dockerfile
    environment:
      - APP_ENV=production
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_NAME=postgres
      - DB_PORT=5432
      - JWT_SECRET=dev_secret_key
    depends_on:
      - postgres
    networks:
      - internal

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_HOST_AUTH_METHOD=${POSTGRES_HOST_AUTH_METHOD:-trust}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
    # postgres is internal-only; accessed by app on the docker network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/proxy:/etc/nginx/conf.d:ro
      - ./infra/proxy/certbot-www:/var/www/certbot:ro
      - ./infra/proxy/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - internal

  certbot:
    image: certbot/certbot:2.6.0
    restart: "no"
    volumes:
      - ./infra/proxy/letsencrypt:/etc/letsencrypt
      - ./infra/proxy:/etc/nginx/conf.d
      - ./infra/proxy/certbot-www:/var/www/certbot
    environment:
      - CERTBOT_DOMAINS=${CERTBOT_DOMAINS}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL}
    command: ["/bin/sh", "/etc/nginx/conf.d/certbot.sh"]
    networks:
      - internal


volumes:
  postgres_data:

networks:
  internal:
    driver: bridge